name: MCP Governance Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - '**.json'
      - '**.java'
      - 'pom.xml'
      - '.github/workflows/mcp-governance-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.json'
      - '**.java'
      - 'pom.xml'
      - '.github/workflows/mcp-governance-scan.yml'

permissions:
  contents: read
  security-events: write

jobs:
  bootstrap-audit:
    name: MCP Config Static Audit & Self-Hosted Verification
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 编译与构建 CLI 可执行包
        run: |
          mvn -B -ntp clean package -DskipTests

      - name: 运行安全基线自举扫描 (预期零漏洞通过)
        run: |
          CLI_JAR=$(find mcp-governance-cli/target -name "mcp-governance-cli-*-all.jar" | head -n 1)
          echo "执行合规基准扫描：samples/clean-mcp.json"
          java -jar "$CLI_JAR" samples/clean-mcp.json -o scan-result-clean.sarif

      - name: 验证阻断性漏洞审计与 Exit Code 2 门禁 (针对脆弱样例)
        run: |
          CLI_JAR=$(find mcp-governance-cli/target -name "mcp-governance-cli-*-all.jar" | head -n 1)
          echo "执行风险对抗扫描：samples/vulnerable-mcp.json"
          set +e
          java -jar "$CLI_JAR" samples/vulnerable-mcp.json -o scan-result-vulnerable.sarif
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "::error::预期脆弱配置应触发 Exit Code 2 (CRITICAL/HIGH)，实际退出码为: $EXIT_CODE"
            exit 1
          fi
          echo "成功捕获阻断性漏洞，退出码符合预期 (Exit Code 2)。"

      - name: 上传自举扫描 SARIF 报告至 GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scan-result-clean.sarif
          category: 'mcp-governance-bootstrap'
