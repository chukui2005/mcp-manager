server:
  port: ${SERVER_PORT:18080}
  address: ${SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,mcpGovernance"

mcp:
  governance:
    gateway:
      host: "127.0.0.1"
      port: 18080
      request-timeout-ms: 30000
      upstreams:
        - id: "demo-service"
          protocol: "http"
          prefix: "demo_"
          uri: "http://127.0.0.1:8081/mcp"
